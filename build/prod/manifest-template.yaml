apiVersion: v1
kind: ConfigMap
metadata:
  name: {{APP_NAME}}-config
  namespace: apps
data:
  APP_NAME: "ProcessAtlas"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://{{APP_NAME}}.robbyte.net"
  APP_LOCALE: "en"
  APP_FALLBACK_LOCALE: "en"
  APP_FAKER_LOCALE: "en_US"
  LOG_CHANNEL: "stack"
  LOG_STACK: "single"
  LOG_LEVEL: "warning"
  DB_CONNECTION: "pgsql"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_DATABASE: "{{APP_NAME}}"
  DB_USERNAME: "{{APP_NAME}}"
  SESSION_DRIVER: "redis"
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: "true"
  SESSION_DOMAIN: "{{APP_NAME}}.robbyte.net"
  SESSION_SAME_SITE: "lax"
  CACHE_STORE: "redis"
  QUEUE_CONNECTION: "redis"
  REDIS_CLIENT: "predis"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MAIL_MAILER: "log"
  SANCTUM_STATEFUL_DOMAINS: "{{APP_NAME}}.robbyte.net"
  SANCTUM_MCP_TOKEN_EXPIRATION_DAYS: "90"
  VITE_APP_NAME: "ProcessAtlas"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{APP_NAME}}-secrets
  namespace: apps
type: Opaque
stringData:
  APP_KEY: "{{APP_KEY}}"
  DB_PASSWORD: "{{DB_PASSWORD}}"
  REDIS_PASSWORD: "{{REDIS_PASSWORD}}"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{APP_NAME}}-migrate
  namespace: apps
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: {{APP_NAME}}
        job: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/rdurica/{{APP_NAME}}:latest
          command: ["php", "artisan", "migrate", "--force"]
          envFrom:
            - configMapRef:
                name: {{APP_NAME}}-config
            - secretRef:
                name: {{APP_NAME}}-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{APP_NAME}}
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{APP_NAME}}
  template:
    metadata:
      labels:
        app: {{APP_NAME}}
    spec:
      containers:
        - name: {{APP_NAME}}
          image: ghcr.io/rdurica/{{APP_NAME}}:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: {{APP_NAME}}-config
            - secretRef:
                name: {{APP_NAME}}-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /up
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /up
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /up
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{APP_NAME}}
  namespace: apps
spec:
  selector:
    app: {{APP_NAME}}
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{APP_NAME}}-tls
  namespace: apps
spec:
  duration: 2160h
  renewBefore: 360h
  subject:
    organizations:
      - robbyte.net
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  dnsNames:
    - {{APP_NAME}}.robbyte.net
  secretName: {{APP_NAME}}-tls
  issuerRef:
    name: prod-issuer
    kind: OriginIssuer
    group: cert-manager.k8s.cloudflare.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{APP_NAME}}-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{APP_NAME}}.robbyte.net`)
      kind: Rule
      services:
        - name: {{APP_NAME}}
          port: 80
  tls:
    secretName: {{APP_NAME}}-tls
